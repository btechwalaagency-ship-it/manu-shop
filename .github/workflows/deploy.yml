name: Deploy to Hostinger

# Every push to main publishes the site. Nothing else triggers it.
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false  # never interrupt a half-finished upload

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Upload changed files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./public_html/
          # Only what belongs on a web server. Everything else stays in the repo.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
            assets/photos/README.md
